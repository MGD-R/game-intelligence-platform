sources:
  rawg:
    enabled: true
    tier: mvp
    base_url: https://api.rawg.io/api
    api_key_env: RAWG_API_KEY
    timeout_seconds: 10
    rate_limit_per_minute: 60
  wikidata:
    enabled: true
    tier: mvp
    base_url: https://www.wikidata.org/w/api.php
    user_agent_env: WIKIMEDIA_USER_AGENT
    timeout_seconds: 10
    rate_limit_per_minute: 60
  steam:
    enabled: false
    tier: optional
    base_url: https://store.steampowered.com/api
    api_key_env: STEAM_API_KEY
    timeout_seconds: 10
    rate_limit_per_minute: 30
  wikipedia:
    enabled: false
    tier: optional
    base_url: https://en.wikipedia.org/api/rest_v1
    user_agent_env: WIKIMEDIA_USER_AGENT
    timeout_seconds: 10
    rate_limit_per_minute: 30
  igdb:
    enabled: false
    tier: advanced
    base_url: https://api.igdb.com/v4
    client_id_env: IGDB_CLIENT_ID
    client_secret_env: IGDB_CLIENT_SECRET
    timeout_seconds: 10
    rate_limit_per_minute: 20
