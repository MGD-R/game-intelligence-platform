sources:
  rawg:
    enabled: true
    tier: mvp
    base_url: https://api.rawg.io/api
    api_key_env: RAWG_API_KEY
    monthly_limit: 20000
    requests_per_second: 1
    cache_enabled: true
    strategy: wide_discovery_then_targeted_details
    default_page_size: 40
    demo_page_limit: 10
    demo_details_limit: 0
    timeout_seconds: 10
    rate_limit_per_minute: 60
  wikidata:
    enabled: true
    tier: mvp
    base_url: https://query.wikidata.org
    sparql_url: https://query.wikidata.org/sparql
    entity_data_url: https://www.wikidata.org/wiki/Special:EntityData/{qid}.json
    user_agent_env: WIKIMEDIA_USER_AGENT
    requests_per_minute: 30
    cache_enabled: true
    strategy: bulk_sparql_identity_hub
    demo_limit: 5000
    timeout_seconds: 10
  steam:
    enabled: true
    tier: optional
    base_url: https://store.steampowered.com/api
    api_key_env: STEAM_API_KEY
    web_api_base_url: https://api.steampowered.com
    store_api_base_url: https://store.steampowered.com/api
    partner_api_base_url: https://partner.steam-api.com
    timeout_seconds: 10
    requests_per_second: 1
    cache_enabled: true
    use_store_appdetails: true
    use_istore_service: false
    use_app_list: false
    strategy: targeted_enrichment_by_steam_appid
    default_language: russian
    default_country: ru
    demo_limit: 50
    rate_limit_per_minute: 30
  wikipedia:
    enabled: true
    tier: optional
    base_url: https://en.wikipedia.org/api/rest_v1
    rest_base_url_template: https://{lang}.wikipedia.org/api/rest_v1
    action_api_url_template: https://{lang}.wikipedia.org/w/api.php
    user_agent_env: WIKIMEDIA_USER_AGENT
    requests_per_minute: 120
    cache_enabled: true
    prefer_sitelinks_from_wikidata: true
    use_opensearch: false
    default_languages:
      - ru
      - en
    demo_limit: 100
    strategy: summaries_by_wikidata_sitelinks
    timeout_seconds: 10
    rate_limit_per_minute: 30
  igdb:
    enabled: false
    tier: advanced
    base_url: https://api.igdb.com/v4
    client_id_env: IGDB_CLIENT_ID
    client_secret_env: IGDB_CLIENT_SECRET
    timeout_seconds: 10
    rate_limit_per_minute: 20
