name: game-intelligence-platform

x-app-env-files: &app-env-files
  - path: .env
    required: false
  - path: .env.secrets
    required: false

x-app-service: &app-service
  depends_on:
    postgres:
      condition: service_healthy
  env_file: *app-env-files
  networks:
    - gip-net

services:
  postgres:
    image: postgres:16-alpine
    container_name: gip-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-gip}"
      POSTGRES_USER: "${POSTGRES_USER:-gip}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gip} -d ${POSTGRES_DB:-gip}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - gip-net

  app:
    <<: *app-service
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: runtime
    container_name: gip-app
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *app-service
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: runtime
    container_name: gip-worker
    command: sleep infinity
    
  app-dev:
    <<: *app-service
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    container_name: gip-app-dev
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker-dev:
    <<: *app-service
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    container_name: gip-worker-dev
    command: sleep infinity
    volumes:
      - ./:/app

  minio:
    image: minio/minio:latest
    container_name: gip-minio
    profiles: ["mlops"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - gip-net

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: gip-mlflow
    profiles: ["mlops"]
    env_file: *app-env-files
    environment:
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:-http://mlflow:5000}"
    command:
      [
        "mlflow",
        "server",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--backend-store-uri",
        "sqlite:////app/mlruns/mlflow.db",
        "--artifacts-destination",
        "/app/mlruns",
      ]
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    depends_on:
      - minio
    networks:
      - gip-net

  notebook:
    build:
      context: .
      dockerfile: docker/notebook/Dockerfile
    container_name: gip-notebook
    profiles: ["notebook"]
    env_file: *app-env-files
    environment:
      APP_ENV: "${APP_ENV:-local}"
      DATA_ROOT: "${DATA_ROOT:-/app/data}"
    command:
      [
        "jupyter",
        "lab",
        "--ip=0.0.0.0",
        "--port=8888",
        "--no-browser",
        "--allow-root",
        "--NotebookApp.token=",
      ]
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
    networks:
      - gip-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gip-pgadmin
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:-admin@example.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:-change-me}"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gip-net

volumes:
  postgres_data:
  minio_data:

networks:
  gip-net:
    driver: bridge
