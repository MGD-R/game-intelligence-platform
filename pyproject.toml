[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "game-intelligence-platform"
version = "0.1.0"
description = "Educational end-to-end game intelligence platform scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.122,<1.0",
  "httpx>=0.28,<1.0",
  "polars>=1.30,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.11,<3.0",
  "PyYAML>=6.0,<7.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.mypy]
python_version = "3.11"
packages = ["src"]
ignore_missing_imports = true
